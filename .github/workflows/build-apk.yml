name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Patch Expo Modules Gradle Plugin
        working-directory: mobile
        run: |
          node -e "
            const fs = require('fs');
            const file = 'node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle';
            if (fs.existsSync(file)) {
              let c = fs.readFileSync(file, 'utf8');
              c = c.replace('from components.release', 'def rel = components.findByName(\"release\"); if (rel != null) { from rel }');
              fs.writeFileSync(file, c);
              console.log('Patched ExpoModulesCorePlugin.gradle successfully');
            }
          "

      - name: Make Gradle executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoPulse-v1.0.0-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
