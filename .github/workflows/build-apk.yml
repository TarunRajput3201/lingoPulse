name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      api_url:
        description: 'Live Backend URL (e.g. https://lingopulse-api.onrender.com)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Patch Expo Modules Gradle Plugin
        working-directory: mobile
        run: |
          node -e "
            const fs = require('fs');
            const file = 'node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle';
            if (fs.existsSync(file)) {
              let c = fs.readFileSync(file, 'utf8');
              c = c.replace('from components.release', 'def rel = components.findByName(\"release\"); if (rel != null) { from rel }');
              fs.writeFileSync(file, c);
              console.log('Patched ExpoModulesCorePlugin.gradle successfully');
            }
          "

      - name: Configure Live API URL
        working-directory: mobile
        run: |
          API="${{ inputs.api_url }}"
          if [ -z "$API" ]; then
            API="${{ vars.EXPO_PUBLIC_API_URL }}"
          fi
          if [ -n "$API" ]; then
            echo "EXPO_PUBLIC_API_URL=$API" >> .env
            echo "Configured EXPO_PUBLIC_API_URL=$API"
          fi

      - name: Make Gradle executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: mobile/android
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoPulse-v1.0.3-apk
          path: mobile/android/app/build/outputs/apk/*/*.apk
          retention-days: 14

      - name: Stage Release APK
        run: |
          mkdir -p release_assets
          # Alias across all standard release filenames so direct download links NEVER fail with 404
          for f in mobile/android/app/build/outputs/apk/*/*.apk; do
            if [ -f "$f" ]; then
              cp "$f" release_assets/LingoPulse-v1.0.3.apk
              cp "$f" release_assets/LingoPulse-v1.0.2.apk
              cp "$f" release_assets/LingoPulse-v1.0.1.apk
              cp "$f" release_assets/LingoPulse-v1.0.0.apk
              cp "$f" release_assets/LingoPulse.apk
              echo "Staged $(basename "$f") as LingoPulse-v1.0.3.apk, LingoPulse-v1.0.2.apk, LingoPulse-v1.0.1.apk, LingoPulse-v1.0.0.apk, LingoPulse.apk"
              break
            fi
          done
          ls -la release_assets/

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "LingoPulse v1.0.3 - Production Release"
          files: |
            release_assets/LingoPulse-v1.0.3.apk
            release_assets/LingoPulse-v1.0.2.apk
            release_assets/LingoPulse-v1.0.1.apk
            release_assets/LingoPulse-v1.0.0.apk
            release_assets/LingoPulse.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
